<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Halloween window</title>
  <meta name="description" content="Write a message for the Halloween window display.">
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" type="module"></script>
</head>
<body>
<main>
  <header><h1>Halloween window</h1><span id="connection" role="status">Connecting…</span></header>
  <p class="intro">Write a message. Watch it scroll in the window.</p>
  <form id="form">
    <label for="message">Your message</label>
    <textarea id="message" placeholder="Happy Halloween!" rows="2" maxlength="60" aria-describedby="hint" spellcheck="false"></textarea>
    <div class="hint" id="hint"><span>Letters, numbers & punctuation. No emoji.</span><span id="count">0/60</span></div>
    <section class="preview" aria-labelledby="preview-label">
      <div class="preview-heading"><span id="preview-label">Display preview</span><button id="pause" type="button" disabled>Pause</button></div>
      <canvas id="display" width="128" height="32" role="img" aria-label="Scrolling preview of Happy Halloween"></canvas>
      <p id="preview-note">Loading the display font…</p>
    </section>
    <button id="send" type="submit" disabled>Send to the window</button>
  </form>
  <p class="error" id="error" role="alert" hidden></p>
  <div class="receipt" id="receipt" aria-live="polite" hidden><strong id="delivery"></strong><span id="sent"></span></div>
  <p class="queue" id="queue">Checking the display…</p>
  <footer>Everyone outside can see your message. Keep it friendly.</footer>
</main>
</body>
</html>
